<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Haotian Luo — frontend engineer, UNSW graduate and independent builder."
    />
    <link rel="icon" type="image/svg+xml" href="/Portfolio/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap"
    />

    <title>Haotian Luo — Frontend Engineer</title>

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        try {
          var saved = localStorage.getItem("hl-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          root.dataset.theme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
        } catch (error) {
          root.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
