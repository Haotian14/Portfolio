<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm Interview Handbook</title>
  <desc id="desc">Cover for an algorithm and machine learning interview handbook with 17 chapters and 201 questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101424"/>
      <stop offset="0.58" stop-color="#17142b"/>
      <stop offset="1" stop-color="#0c1824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8d7cff"/>
      <stop offset="1" stop-color="#53e6c1"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1030" cy="100" r="250" fill="#7867ff" opacity=".09"/>
  <circle cx="1085" cy="550" r="320" fill="#42d9ba" opacity=".06"/>

  <g transform="translate(76 70)">
    <rect width="170" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="18" cy="16" r="4" fill="#67e8c4"/>
    <text x="32" y="20.5" fill="#b9c3d8" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.6">INTERVIEW SYSTEM</text>

    <text y="130" fill="#f4f5fb" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.6">ALGORITHM</text>
    <text y="205" fill="#f4f5fb" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.6">INTERVIEW HANDBOOK</text>
    <rect y="240" width="392" height="5" rx="2.5" fill="url(#accent)"/>

    <text y="305" fill="#9da8c0" font-family="ui-monospace, monospace" font-size="17" letter-spacing="1.2">LLM  ·  RECOMMENDATION  ·  CV</text>
    <text y="338" fill="#9da8c0" font-family="ui-monospace, monospace" font-size="17" letter-spacing="1.2">ML  ·  SYSTEM DESIGN  ·  CODING</text>

    <g transform="translate(0 430)">
      <text fill="#f4f5fb" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">17</text>
      <text x="68" y="-4" fill="#aab4c8" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">SYSTEMATIC</text>
      <text x="68" y="15" fill="#aab4c8" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">CHAPTERS</text>
      <line x1="202" y1="-24" x2="202" y2="22" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="240" fill="#f4f5fb" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">201</text>
      <text x="334" y="-4" fill="#aab4c8" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">HIGH-FREQUENCY</text>
      <text x="334" y="15" fill="#aab4c8" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">QUESTIONS</text>
    </g>
  </g>

  <g transform="translate(790 188)">
    <rect width="330" height="322" rx="18" fill="#090d18" stroke="#ffffff" stroke-opacity=".16"/>
    <rect width="330" height="45" rx="18" fill="#ffffff" fill-opacity=".045"/>
    <circle cx="24" cy="22" r="4" fill="#ff718a"/>
    <circle cx="40" cy="22" r="4" fill="#ffd166"/>
    <circle cx="56" cy="22" r="4" fill="#67e8c4"/>
    <text x="24" y="88" fill="#697694" font-family="ui-monospace, monospace" font-size="13">01</text>
    <text x="62" y="88" fill="#8d7cff" font-family="ui-monospace, monospace" font-size="13">def</text>
    <text x="92" y="88" fill="#dce2f1" font-family="ui-monospace, monospace" font-size="13">attention(Q, K, V):</text>
    <text x="24" y="120" fill="#697694" font-family="ui-monospace, monospace" font-size="13">02</text>
    <text x="62" y="120" fill="#dce2f1" font-family="ui-monospace, monospace" font-size="13">score = Q @ K.T</text>
    <text x="24" y="152" fill="#697694" font-family="ui-monospace, monospace" font-size="13">03</text>
    <text x="62" y="152" fill="#dce2f1" font-family="ui-monospace, monospace" font-size="13">score /= sqrt(d)</text>
    <text x="24" y="184" fill="#697694" font-family="ui-monospace, monospace" font-size="13">04</text>
    <text x="62" y="184" fill="#8d7cff" font-family="ui-monospace, monospace" font-size="13">return</text>
    <text x="116" y="184" fill="#67e8c4" font-family="ui-monospace, monospace" font-size="13">softmax</text>
    <text x="174" y="184" fill="#dce2f1" font-family="ui-monospace, monospace" font-size="13">(score) @ V</text>
    <line x1="24" y1="224" x2="306" y2="224" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="260" fill="#7f8ca6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.2">QUESTION → ANSWER → FOLLOW-UP</text>
    <rect x="24" y="282" width="174" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <text x="1120" y="622" text-anchor="end" fill="#64708a" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">HAOTIAN14 / 2026</text>
</svg>
