<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hart Luo">
  <rect width="64" height="64" rx="14" fill="#CC785C"/>
  <g fill="#F7F4ED">
    <!-- H: two stems, crossbar, bracketed serifs top and bottom -->
    <rect x="8" y="18" width="6" height="28"/>
    <rect x="22" y="18" width="6" height="28"/>
    <rect x="14" y="29" width="8" height="6"/>
    <rect x="5" y="18" width="12" height="3.4"/>
    <rect x="19" y="18" width="12" height="3.4"/>
    <rect x="5" y="42.6" width="12" height="3.4"/>
    <rect x="19" y="42.6" width="12" height="3.4"/>
    <!-- L: stem with a top serif and an extended foot -->
    <rect x="37" y="18" width="6" height="28"/>
    <rect x="34" y="18" width="12" height="3.4"/>
    <rect x="37" y="42.6" width="14" height="3.4"/>
    <!-- The full stop that closes the wordmark -->
    <circle cx="56" cy="43" r="3.3"/>
  </g>
</svg>
